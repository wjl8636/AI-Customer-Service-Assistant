<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>喵喵优选 · 分类器评测详情</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='2' y='2' width='4' height='4' fill='%232b2632'/><rect x='10' y='2' width='4' height='4' fill='%232b2632'/><rect x='2' y='4' width='12' height='9' fill='%232b2632'/><rect x='3' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='11' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='3' y='5' width='10' height='7' fill='%23ff9f57'/><rect x='5' y='7' width='1' height='2' fill='%232b2632'/><rect x='10' y='7' width='1' height='2' fill='%232b2632'/><rect x='7' y='9' width='2' height='1' fill='%23ff8095'/></svg>" />
  <link rel="stylesheet" href="/static/acceptance.css" />
  <style>
    /* micro vs macro 对照 */
    .avg { display: flex; gap: 14px; flex-wrap: wrap; }
    .avgbox { flex: 1; min-width: 260px; border: 3px solid var(--ink); background: var(--paper); padding: 10px 13px; }
    .avgbox h3 { margin: 0 0 3px; font-size: 13px; }
    .avgbox .way { color: var(--muted); font-size: 11.5px; }
    .avgbox .nums { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; }
    .avgbox .nums b { font-size: 17px; display: block; font-variant-numeric: tabular-nums; }

    /* 阈值扫描九候选线 */
    .scan { display: flex; flex-direction: column; gap: 5px; }
    .scanrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; }
    .scanrow .t { width: 3.4em; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
    .scanrow .track { flex: 1; border: 2px solid var(--ink); background: var(--paper); height: 18px; }
    .scanrow .fill { height: 100%; background: var(--fur); display: block; }
    .scanrow.win .fill { background: var(--online); }
    .scanrow.inuse .t::after { content: " ◀"; color: var(--coral); }
    .scanrow .f1 { width: 4.6em; font-variant-numeric: tabular-nums; }
    .scanrow .tag { font-size: 11.5px; color: var(--muted); }

    /* 混淆矩阵 17 宫格 */
    .mats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); }
    .mat { border: 3px solid var(--ink); background: var(--paper); }
    .mat .cap {
      display: flex; align-items: center; gap: 6px; padding: 4px 7px;
      border-bottom: 2px solid var(--ink); font-size: 12.5px; font-weight: 700;
    }
    .mat.dirty .cap { background: #ffe9ec; }
    .mat .grid { display: grid; grid-template-columns: 1fr 1fr; }
    .mat .c { padding: 5px 7px; font-size: 11.5px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
    .mat .c:nth-child(2n) { border-right: 0; }
    .mat .c:nth-child(n+3) { border-bottom: 0; }
    .mat .c { white-space: nowrap; }
    .mat .c b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
    .mat .c.tp b { color: #2f8f3c; }
    .mat .c.fp b, .mat .c.fn b { color: var(--error); }
    .mat .c.k { color: var(--muted); }

    /* 单句试分类 */
    .tryrow { display: flex; gap: 8px; flex-wrap: wrap; }
    .tryrow input {
      flex: 1; min-width: 240px; font: inherit; font-size: 13px; padding: 7px 10px;
      border: 3px solid var(--ink); background: var(--paper);
    }
    .presets { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .sc { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
    .scrow { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
    .scrow .nm { width: 5.6em; text-align: right; flex-shrink: 0; }
    .scrow .track { flex: 1; border: 2px solid var(--ink); background: var(--paper); height: 16px; position: relative; }
    .scrow .fill { height: 100%; background: #e6dcc9; display: block; }
    .scrow.hit .fill { background: var(--online); }
    .scrow.hit .nm { font-weight: 700; }
    .scrow:not(.hit) { opacity: .62; }
    .scrow .v { width: 4em; font-variant-numeric: tabular-nums; }
    .scrow .line { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--coral); }
    .verdict { margin-top: 10px; font-size: 13px; background: var(--paper); border: 2px solid var(--ink); padding: 8px 11px; line-height: 1.75; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>分类器评测详情</h1>
      <span class="sub">每类 P/R/F1 · 容错红线 · 混淆矩阵 · 阈值</span>
      <span class="spacer"></span>
      <button class="btn" id="refreshBtn">刷新</button>
    </div>

    <div class="gatebar" id="gatebar"></div>
    <div id="body"><div class="panel"><div class="miss">加载中…</div></div></div>
  </div>

  <div id="toast"></div>

  <script src="/static/admin.js"></script>
  <script src="/static/acceptance.js"></script>
  <script>
    let jobSpecs = {};

    async function load() {
      try {
        const [d, j] = await Promise.all([
          api("/api/acceptance/eval"),
          api("/api/jobs"),
        ]);
        jobSpecs = Object.fromEntries(j.jobs.map((x) => [x.name, x]));
        render(d);
      } catch (e) {
        $("body").textContent = "";
        $("body").appendChild(missingBox("加载失败：" + e.message));
      }
    }

    function panel(title, lede, pill) {
      const p = el("div", "panel");
      const h = el("h2", "", title);
      if (pill) { const [c, t] = pill; h.appendChild(el("span", "pill " + c, t)); }
      p.appendChild(h);
      if (lede) p.appendChild(el("p", "lede", lede));
      return p;
    }

    function render(d) {
      const ev = d.eval, scan = d.scan;
      renderGatebar(d);
      const body = $("body");
      body.textContent = "";

      /* ① micro vs macro */
      const pAvg = panel("总分：micro 与 macro 一起看",
        "micro 不分科——17 类的所有对错混进一个大桶算总分，量大的类目话语权大。"
        + "macro 分科——先给 17 类各算一个 F1 再简单平均，小类目和大类目一样权重。"
        + "两个数差不多，说明各类成绩均匀，没有小类目被大类目的好成绩盖住。");
      if (!ev.present) { pAvg.appendChild(missingBox(ev.hint)); }
      else {
        const avg = el("div", "avg");
        for (const [key, name, way] of [
          ["micro", "micro", "不分科：所有对错混一个桶"],
          ["macro", "macro", "分科：17 类各算再平均"],
        ]) {
          const box = el("div", "avgbox");
          box.appendChild(el("h3", "", name));
          box.appendChild(el("div", "way", way));
          const nums = el("div", "nums");
          for (const k of ["p", "r", "f1"]) {
            const c = el("div");
            c.appendChild(el("b", "", ev[key][k].toFixed(3)));
            c.appendChild(el("span", "", k.toUpperCase()));
            nums.appendChild(c);
          }
          box.appendChild(nums);
          avg.appendChild(box);
        }
        pAvg.appendChild(avg);
        const gap = Math.abs(ev.micro.f1 - ev.macro.f1);
        pAvg.appendChild(el("div", "tip",
          "两者相差 " + gap.toFixed(3) + "："
          + (gap <= 0.02 ? "各类成绩均匀，没有类目出问题被总分盖住。"
            : "差距偏大，micro 高 macro 低说明有小类目被牺牲，去下面每类指标里找是哪个。")));
      }
      if (jobSpecs["ch10-eval"]) pAvg.appendChild(jobRow([jobSpecs["ch10-eval"]], load,
        "评测集 " + (ev.present ? ev.test_size + " 条" : "test.jsonl")));
      body.appendChild(pAvg);

      /* ② 每类指标 + 容错红线 */
      const pCls = panel("每类指标与容错红线",
        "容错红线不是每类一条，而是按档位设闸：17 类按「归错了会不会带偏补知识的优先级」"
        + "分严/中/宽三档，严档 F1 ≥ 0.9、中档 ≥ 0.8，宽档归错影响小、不设线（画 — 而不是 ✅）。"
        + "support 是这一类在测试集里有多少道题，与混淆矩阵对得上：support = TP + FN。",
        ev.present ? (ev.red_line_passed ? ["pass", "红线全过"] : ["fail", "有类目跌破红线"]) : null);
      if (!ev.present) pCls.appendChild(missingBox(ev.hint));
      else {
        const box = el("div", "scroll-x");
        const t = el("table", "tbl");
        const thead = el("thead");
        const hr = el("tr");
        for (const h of ["类目", "档位", "P", "R", "F1", "support", "红线"]) hr.appendChild(el("th", "", h));
        thead.appendChild(hr); t.appendChild(thead);
        const tb = el("tbody");
        for (const c of ev.classes) {
          const tr = el("tr", c.passed === false ? "bad" : "");
          tr.appendChild(el("td", "", c.name));
          const sev = el("td");
          sev.appendChild(el("span", "pill sev-" + c.severity, c.severity));
          tr.appendChild(sev);
          tr.appendChild(scoreCell(c.p, null));
          tr.appendChild(scoreCell(c.r, null));
          tr.appendChild(scoreCell(c.f1, c.red_line));
          tr.appendChild(el("td", "num", String(c.support)));
          const rl = el("td");
          if (c.red_line === null) rl.appendChild(el("span", "", "—"));
          else rl.appendChild(el("span", "pill " + (c.passed ? "pass" : "fail"),
            c.red_line + (c.passed ? " ✅" : " 🔴 回头搞数据")));
          tr.appendChild(rl);
          tb.appendChild(tr);
        }
        t.appendChild(tb);
        box.appendChild(t);
        pCls.appendChild(box);
      }
      body.appendChild(pCls);

      /* ③ 阈值扫描九候选线 */
      const pScan = panel("判定阈值：九候选线扫描重演",
        "模型对每句话给 17 个类各打一个 0~1 的分，过线的类才算命中，这条线就是判定阈值。"
        + "定太低会冤枉、定太高会放跑。验证集打分一次、分数表固定，九个候选线（0.30~0.70 步进 0.05）"
        + "套同一张表各算一遍 micro-F1，谁高谁当选；打平时先到的留任，所以 0.45 压住 0.50。",
        scan.present ? (scan.consistent ? ["pass", "与在用阈值一致"] : ["fail", "与在用阈值不一致"]) : null);
      if (!scan.present) pScan.appendChild(missingBox(scan.hint));
      else {
        const lo = Math.min(...scan.scan.map((s) => s.micro_f1));
        const hi = Math.max(...scan.scan.map((s) => s.micro_f1));
        const wrap = el("div", "scan");
        for (const s of scan.scan) {
          const win = Math.abs(s.threshold - scan.best_threshold) < 1e-9;
          const inuse = Math.abs(s.threshold - (scan.in_use_threshold ?? -1)) < 1e-9;
          const row = el("div", "scanrow" + (win ? " win" : "") + (inuse ? " inuse" : ""));
          row.appendChild(el("span", "t", s.threshold.toFixed(2)));
          const track = el("span", "track");
          const fill = el("span", "fill");
          // 九条分数挤在小数第三位,按 min~max 拉伸才看得出高低(线性 0~1 会是九条一样长的条)
          fill.style.width = (hi > lo ? 8 + 92 * (s.micro_f1 - lo) / (hi - lo) : 100) + "%";
          track.appendChild(fill);
          row.appendChild(track);
          row.appendChild(el("span", "f1", s.micro_f1.toFixed(4)));
          row.appendChild(el("span", "tag",
            (win ? "当选" : "") + (inuse ? (win ? " · threshold.json 在用" : "threshold.json 在用") : "")));
          wrap.appendChild(row);
        }
        pScan.appendChild(wrap);
        pScan.appendChild(el("div", "tip",
          "重演当选 " + scan.best_threshold.toFixed(2) + "（验证集 micro-F1 "
          + scan.best_micro_f1.toFixed(4) + "），threshold.json 在用 " + scan.in_use_threshold
          + (scan.consistent ? "，两者一致 ✅——扫描可复算，不是拍的。"
            : "，两者不一致 🔴——重新导出或重跑扫描。")
          + " 验证集 " + scan.val_size + " 条，跑于 " + fmtTime(scan.ran_at) + "。"));
      }
      if (jobSpecs["ch10-threshold-scan"]) pScan.appendChild(
        jobRow([jobSpecs["ch10-threshold-scan"]], load,
          d.classifier.online ? ":8110 在线" : ":8110 离线，先去总览页拉起服务"));
      body.appendChild(pScan);

      /* ④ 混淆矩阵 */
      const pMat = panel("每类混淆矩阵：错题本",
        "P/R/F1 是分数，混淆矩阵是错题本——分数说考得好不好，错题本说错在哪个方向、该回头改什么。"
        + "TP 该打打对了、TN 不该打也没打、FP 冤枉（不该打却打了）、FN 放跑（该打却没打）。"
        + "要紧的不是错几个，是错的方向性。");
      if (!ev.present) pMat.appendChild(missingBox(ev.hint));
      else {
        const errs = ev.total_fp + ev.total_fn;
        pMat.appendChild(el("div", "tip",
          "全表 " + ev.total_cells + " 道是非题（" + ev.test_size + " 条 × 17 类）错 " + errs
          + " 道：冤枉 " + ev.total_fp + " 次、放跑 " + ev.total_fn + " 次。"));
        const mats = el("div", "mats");
        for (const c of ev.classes) {
          const m = el("div", "mat" + (c.fp || c.fn ? " dirty" : ""));
          const cap = el("div", "cap");
          cap.appendChild(el("span", "", c.name));
          cap.appendChild(el("span", "spacer"));
          cap.appendChild(el("span", "pill sev-" + c.severity, c.severity));
          m.appendChild(cap);
          const g = el("div", "grid");
          for (const [cls, key, label] of [
            ["tn k", "tn", "TN 不该打"], ["fp", "fp", "FP 冤枉"],
            ["fn", "fn", "FN 放跑"], ["tp", "tp", "TP 打对"],
          ]) {
            const cell = el("div", "c " + cls);
            cell.appendChild(el("b", "", String(c[key])));
            cell.appendChild(el("span", "", label));
            g.appendChild(cell);
          }
          m.appendChild(g);
          mats.appendChild(m);
        }
        pMat.appendChild(mats);
        const a = el("a", "btn sm", "去错例复核页看这些错具体错在哪 →");
        a.href = "/acceptance/errors";
        const row = el("div", "jobrow");
        row.appendChild(a);
        pMat.appendChild(row);
      }
      body.appendChild(pMat);

      /* ⑤ 单句试分类 */
      const pTry = panel("单句试分类：多标签机制现场看",
        "17 个类各自独立过线，过几个打几个——这就是多标签的机制来源。"
        + "要是 17 个分全都不过线，取分数最高的那个类兜底，保证每道题至少有一个标签。",
        d.classifier.online ? ["pass", ":8110 在线"] : ["missing", ":8110 离线"]);
      const row = el("div", "tryrow");
      const input = el("input");
      input.placeholder = "输入一句用户问题，比如：买大了想退";
      input.value = "买大了想退";
      const go = el("button", "btn go", "试分类");
      row.appendChild(input); row.appendChild(go);
      pTry.appendChild(row);
      const presets = el("div", "presets");
      for (const t of ["买大了想退", "猫粮颗粒大不大，牙口不好的猫嚼得动吗",
        "积分可以拿来抵运费吗，要是退货运费又是谁承担", "旧猫笼你们回收吗"]) {
        const b = el("button", "btn sm", t.length > 14 ? t.slice(0, 14) + "…" : t);
        b.title = t;
        b.addEventListener("click", () => { input.value = t; go.click(); });
        presets.appendChild(b);
      }
      pTry.appendChild(presets);
      const out = el("div");
      pTry.appendChild(out);
      async function tryIt() {
        const text = input.value.trim();
        if (!text) { toast("先输入一句话", true); return; }
        go.disabled = true; go.textContent = "打分中…";
        out.textContent = "";
        try {
          const r = await api("/api/acceptance/classify", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });
          const v = el("div", "verdict");
          v.appendChild(el("b", "", "命中标签：" + (r.labels.join(" + ") || "（无）")));
          v.appendChild(el("div", "", "判定阈值 " + r.threshold
            + (r.fallback ? "；17 类全部不过线，已走「取最高分兜底」" : "；过线的类全部打上")));
          out.appendChild(v);
          const sc = el("div", "sc");
          for (const s of r.scores) {
            const line = el("div", "scrow" + (s.hit ? " hit" : ""));
            line.appendChild(el("span", "nm", s.label));
            const track = el("span", "track");
            const fill = el("span", "fill");
            fill.style.width = Math.max(1, Math.round(s.score * 100)) + "%";
            track.appendChild(fill);
            const lineMark = el("span", "line");
            lineMark.style.left = (r.threshold * 100) + "%";
            lineMark.title = "判定阈值 " + r.threshold;
            track.appendChild(lineMark);
            line.appendChild(track);
            line.appendChild(el("span", "v", s.score.toFixed(3)));
            sc.appendChild(line);
          }
          out.appendChild(sc);
        } catch (e) {
          out.appendChild(missingBox("试分类失败：" + e.message));
        } finally { go.disabled = false; go.textContent = "试分类"; }
      }
      go.addEventListener("click", tryIt);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryIt(); });
      body.appendChild(pTry);
      if (d.classifier.online) tryIt();
    }

    function renderGatebar(d) {
      const bar = $("gatebar");
      bar.textContent = "";
      const ev = d.eval;
      const add = (label, value, cls) => {
        const s = el("div", "stat " + (cls || ""));
        s.appendChild(el("span", "", label));
        const b = el("b", "", value);
        if (String(value).length > 6) { b.style.fontSize = "14px"; b.style.lineHeight = "2"; }
        s.appendChild(b);
        bar.appendChild(s);
      };
      if (ev.present) {
        add("测试集", ev.test_size + " 条");
        add("判定阈值", String(ev.threshold));
        add("micro-F1", ev.micro.f1.toFixed(3), ev.red_line_passed ? "pass" : "");
        add("macro-F1", ev.macro.f1.toFixed(3));
        add("容错红线", ev.red_line_passed ? "全过" : "有不达标", ev.red_line_passed ? "pass" : "fail");
        add("评测于", fmtTime(ev.ran_at).slice(5, 16));
      } else {
        add("评测产物", "未生成", "fail");
      }
    }

    mountAdminNav("/acceptance/eval");
    $("refreshBtn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
